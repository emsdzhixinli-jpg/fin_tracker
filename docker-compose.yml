services:
  kafka:
    image: confluentinc/cp-kafka:8.0.7
    pull_policy: never # Can remove accordingly
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092 # The localhost is required to be set if using remote machines.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: confluentinc/cp-kafka:8.0.7
    pull_policy: never # Can remove accordingly
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic transactions --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic config_sync --partitions 1 --replication-factor 1

  producer:
    build: .
    env_file:
      - .env
    environment:
      # In-network broker address (overrides .env host default).
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  consumer:
    build: .
    command: ["python", "-m", "services.consumer"]
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      producer:
        condition: service_started
